[advisories]
ignore = [
    # instant 0.1.13 — unmaintained crate. Transitive dep: nostr → instant.
    # Will be resolved when nostr crate updates its dependencies.
    { id = "RUSTSEC-2024-0384", reason = "transitive dep via nostr; no upstream fix available" },
    # paste 1.0.15 — unmaintained. Transitive dep: mesh-llm → iroh → netlink-* → paste.
    # No safe upgrade available; tracked for upstream (iroh/netlink) replacement.
    { id = "RUSTSEC-2024-0436", reason = "transitive dep via mesh-llm → iroh → netlink; no upstream fix available" },
    # nostr-relay-pool 0.44.3 — unmaintained as a standalone crate; its
    # functionality moved into nostr-sdk >= 0.45. Not a vulnerability: the
    # advisory carries no patched version ("No safe upgrade is available"), so
    # `cargo update` cannot clear it.
    #
    # This workspace does not depend on it. It arrives only on a dev edge —
    # mesh-llm v0.73.1 (pinned git tag) → nostr-sdk 0.44.1 → nostr-relay-pool —
    # reachable solely through buzz-relay's [dev-dependencies]:
    # `cargo tree --workspace --edges normal --target all -i nostr-relay-pool`
    # prints nothing on any target. Remove this when mesh-llm moves to
    # nostr-sdk >= 0.45.
    { id = "RUSTSEC-2026-0243", reason = "transitive via mesh-llm → nostr-sdk; dev-dependency only; folded into nostr-sdk >= 0.45, no upgrade available at this pin" },
    # unsafe-libyaml 0.2.11 — unmaintained (repository archived 2024-03-25), not a
    # vulnerability report. Transitive dep: serde_yaml → unsafe-libyaml. The serde_yaml_ng
    # fork uses the same crate, so removing it means migrating YAML parsing in
    # buzz-agent, buzz-persona, buzz-relay, buzz-workflow and desktop.
    { id = "RUSTSEC-2024-0449", reason = "transitive via serde_yaml; unmaintained, not vulnerable; removal needs a YAML parser migration" },
    # zip 2.4.2: extraction keeps setuid/setgid bits (0367), creates symlinks that
    # escape the destination (0368) and applies permissions through symlinks (0369).
    # Path: mesh-llm v0.73.1 → mesh-llm-host-runtime / plugin-manager / system → zip.
    # Upgrade to zip >=9 is not reachable at this mesh-llm pin; recheck on bump.
    { id = "RUSTSEC-2026-0367", reason = "zip 2.4.2 via mesh-llm v0.73.1; pinned transitive; no zip>=9 at this mesh-llm pin" },
    { id = "RUSTSEC-2026-0368", reason = "zip 2.4.2 via mesh-llm v0.73.1; pinned transitive; no zip>=9 at this mesh-llm pin" },
    { id = "RUSTSEC-2026-0369", reason = "zip 2.4.2 via mesh-llm v0.73.1; pinned transitive; no zip>=9 at this mesh-llm pin" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MITNFA",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    # minicbor's permissive, OSI-approved license. Used for strict App Attest
    # assertion CBOR parsing and also transitively by appattest.
    "BlueOak-1.0.0",
    # bzip2/libbzip2's permissive BSD-like license. New via desktop zip/bzip2
    # transitive deps; compatible with Apache-2.0 distribution.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

# mesh-llm workspace crates (pinned git dep) omit a per-crate `license` field in
# their manifests, so cargo-deny reports them as unlicensed. The mesh-llm repo is
# licensed "MIT OR Apache-2.0" (workspace Cargo.toml + top-level LICENSE = Apache-2.0);
# clarify each pulled-in member to that expression. Remove once mesh sets the field
# upstream (filed).
[[licenses.clarify]]
crate = "mesh-llm-config"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-gpu-bench"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-host-runtime"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-plugin"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-system"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-mixture-of-agents"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "buzz-desktop"
expression = "Apache-2.0"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
